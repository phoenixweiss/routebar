<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">RouteBar mark</title>
  <desc id="description">Three colored routes exchange lanes through a deep teal circular routing boundary.</desc>
  <style>
    .routebar-ink { stroke: #173f4c; }
    @media (prefers-color-scheme: dark) {
      .routebar-ink { stroke: #d7e6e9; }
    }
  </style>
  <circle class="routebar-ink" cx="32" cy="32" r="20" fill="none" stroke-width="3.333"/>
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 42H32C35.5 42 36.5 32 40 32H57" stroke="#79c943"/>
    <path d="M7 22H24C29 22 35 42 40 42H57" stroke="#2f6bff"/>
    <path d="M7 32H24C27.5 32 28.5 22 32 22H57" stroke="#ff704d"/>
  </g>
