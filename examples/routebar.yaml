# This example is fictional. Replace every network, domain, address, and endpoint
# with values from your own environment.
version: 1

profiles:
  - id: home
    name: Home
    match:
      ssids:
        - Example Wi-Fi
    groups:
      - work
      - library
      - mail

groups:
  - id: work
    name: Work services
    mode: bypass-vpn
    domains:
      - portal.example.com
      - account.example.com
    addresses: []
    checks:
      - type: https
        url: https://portal.example.com/
        expected_statuses: [200, 302]

  - id: library
    name: Library
    mode: bypass-vpn
    domains:
      - library.example.org
    addresses: []
    checks:
      - type: https
        url: https://library.example.org/
        expected_statuses: [200]

  - id: mail
    name: Mail transport
    mode: check-only
    endpoints:
      - name: SMTP with implicit TLS
        host: smtp.example.net
        port: 465
        protocol: tls
      - name: SMTP with STARTTLS
        host: smtp.example.net
        port: 587
        protocol: starttls-smtp
      - name: IMAP with implicit TLS
        host: imap.example.net
        port: 993
        protocol: tls
