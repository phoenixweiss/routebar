# This example is fictional. Replace every network, domain, address, and endpoint
# with values from your own environment.
version: 1

profiles:
  - id: home
    name: Home
    match:
      ssids:
        - Example Wi-Fi
    groups:
      - work
      - library
      - mail
      - status

groups:
  - id: work
    name: Work services
    mode: bypass-vpn
    domains:
      - example.com
      - example.net
    addresses: []
    checks:
      - type: https
        url: https://example.com/
        expected_statuses: [200, 302]

  - id: library
    name: Library
    mode: bypass-vpn
    domains:
      - example.org
    addresses: []
    checks:
      - type: https
        url: https://example.org/
        expected_statuses: [200]

  - id: mail
    name: Mail transport
    mode: check-only
    endpoints:
      - name: SMTP with implicit TLS
        host: smtp.example.net
        port: 465
        protocol: tls
        # Optional TCP deadline, including DNS; default: 5, allowed: 0.1–30.
        timeout_seconds: 5
      - name: SMTP with STARTTLS
        host: smtp.example.net
        port: 587
        protocol: starttls-smtp
      - name: IMAP with implicit TLS
        host: imap.example.net
        port: 993
        protocol: tls

  - id: status
    name: Web status (checks only)
    mode: check-only
    checks:
      - type: https
        url: https://status.example.org/health
        expected_statuses: [200, 204]
        timeout_seconds: 5
